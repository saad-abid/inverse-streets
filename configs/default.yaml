# Default configuration for InverseStreets.
# All phases read their parameters from this file.

seed: 42

paths:
  data_dir: data
  models_dir: models
  results_dir: results

dataset:
  image_size: 64          # images are image_size x image_size pixels
  n_samples: 5000
  splits:                 # train / validation / test fractions
    train: 0.70
    val: 0.15
    test: 0.15
  styles: [regular_grid, irregular_grid, radial, cul_de_sac]

grid:
  spacing_min: 8          # street spacing in pixels
  spacing_max: 16
  road_width_min: 1       # road width in pixels
  road_width_max: 3
  removal_prob_min: 0.1   # irregular grid: chance to remove a street segment,
  removal_prob_max: 0.4   #   drawn uniformly per layout in [min, max]
  max_shift: 2            # irregular grid: max street shift in pixels

radial:
  n_spokes_min: 4
  n_spokes_max: 10

cul_de_sac:
  branch_prob: 0.8        # chance of a dead-end branch at each position on each side
  spur_prob: 0.4          # chance that a branch gets a short side spur

graph:
  min_spur_length: 3.0    # dead-end edges shorter than this (px) are skeleton artefacts
  merge_length: 3.0       # intersections closer than this (px) are merged into one
  border_margin: 2        # road ends within this distance (px) of the border are border exits
  n_sources: 20           # random source nodes for path-length / detour statistics
  min_euclid: 5.0         # ignore node pairs closer than this (px) for the detour index

traffic:                  # simplified all-or-nothing assignment, NOT a calibrated simulation
  n_trips: 200            # origin-destination trips per layout
  congestion_threshold: 2.0   # load / mean load above which a segment counts as congested
  min_block_area: 4       # ignore city blocks smaller than this (pixels)

predictor:
  targets: [road_density, n_intersections, avg_shortest_path, congestion_index]
  channels: [16, 32, 64, 64]   # conv blocks; each halves the image size

generator:                # conditional VAE (Phase 4)
  conditions: [road_density, n_intersections]   # add congestion_index later
  latent_dim: 32
  channels: [32, 64, 128, 128]
  beta: 1.0               # weight of the KL term
  kl_warmup_epochs: 5     # KL weight rises from 0 to beta over these epochs
  epochs: 30
  batch_size: 64
  learning_rate: 0.001
  threshold: 0.5          # post-processing: road if probability > threshold
  calibrate_threshold: true   # choose the threshold on validation targets (density match)
  threshold_candidates: [0.25, 0.3, 0.35, 0.4, 0.45, 0.5]
  max_fragment_size: 10   # remove road fragments of <= this many pixels
  max_hole_size: 4        # fill holes of <= this many pixels

constraints:              # Phase 6
  density_min: 0.10
  density_max: 0.60
  min_connectivity: 0.95  # generated layouts: share of nodes in the largest network
  density_bin: 0.05       # width of the density window for the intersections rule
  intersections_percentiles: [1, 99]
  support_radius: 0.25    # "similar layout" radius in standardized (density, intersections) units
  min_support: 5          # similar training layouts needed to accept a combination

llm:                      # Phase 6, optional local LLM through Ollama
  model: qwen3.5:4b
  url: http://localhost:11434/api/chat
  temperature: 0.0
  num_gpu: 0              # model layers on the GPU; 0 = CPU only (avoids GPU driver/CUDA mismatches)
  timeout_s: 180
  n_generate: 20          # layouts generated per accepted request

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  num_workers: 0          # 0 is safest on Windows
