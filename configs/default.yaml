# Default configuration for InverseStreets.
# All phases read their parameters from this file.

seed: 42

paths:
  data_dir: data
  models_dir: models
  results_dir: results

dataset:
  image_size: 64          # images are image_size x image_size pixels
  n_samples: 5000
  splits:                 # train / validation / test fractions
    train: 0.70
    val: 0.15
    test: 0.15
  styles: [regular_grid, irregular_grid, radial, cul_de_sac]

grid:
  spacing_min: 8          # street spacing in pixels
  spacing_max: 16
  road_width_min: 1       # road width in pixels
  road_width_max: 3
  removal_prob_min: 0.1   # irregular grid: chance to remove a street segment,
  removal_prob_max: 0.4   #   drawn uniformly per layout in [min, max]
  max_shift: 2            # irregular grid: max street shift in pixels

radial:
  n_spokes_min: 4
  n_spokes_max: 10

cul_de_sac:
  branch_prob: 0.8        # chance of a dead-end branch at each position on each side
  spur_prob: 0.4          # chance that a branch gets a short side spur

graph:
  min_spur_length: 3.0    # dead-end edges shorter than this (px) are skeleton artefacts
  merge_length: 3.0       # intersections closer than this (px) are merged into one
  border_margin: 2        # road ends within this distance (px) of the border are border exits
  n_sources: 20           # random source nodes for path-length / detour statistics
  min_euclid: 5.0         # ignore node pairs closer than this (px) for the detour index

traffic:                  # simplified all-or-nothing assignment, NOT a calibrated simulation
  n_trips: 200            # origin-destination trips per layout
  congestion_threshold: 2.0   # load / mean load above which a segment counts as congested
  min_block_area: 4       # ignore city blocks smaller than this (pixels)

training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.001
  num_workers: 0          # 0 is safest on Windows
